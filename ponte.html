<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Cara das Ofertas | Grupo VIP de Perfumes</title>
    <meta name="description"
        content="Entre no grupo VIP do Cara das Ofertas e receba promoções exclusivas de perfumes árabes, importados e nacionais direto no seu WhatsApp!">
    <meta property="og:title" content="O Cara das Ofertas | Grupo VIP de Perfumes">
    <meta property="og:description"
        content="As melhores promoções de perfumes direto no seu WhatsApp! 100% gratuito.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="ponte.css">
</head>

<body>
    <div class="ponte-page">
        <!-- Background Effects -->
        <div class="bg-glow bg-glow-top" aria-hidden="true"></div>
        <div class="bg-glow bg-glow-bottom" aria-hidden="true"></div>
        <div class="bg-noise" aria-hidden="true"></div>

        <main class="ponte-main">
            <!-- Avatar Section -->
            <div class="avatar-section anim-in anim-delay-0">
                <div class="avatar-container">
                    <div class="avatar-pulse-ring"></div>
                    <div class="avatar-frame">
                        <img src="persona-avatar.png" alt="O Cara das Ofertas" class="avatar-img">
                    </div>
                    <span class="online-dot" aria-label="Online"></span>
                </div>
            </div>

            <!-- Persona Name -->
            <p class="persona-name anim-in anim-delay-1">O CARA DAS OFERTAS</p>

            <!-- Headline -->
            <h1 class="ponte-headline anim-in anim-delay-2">
                CHEGA DE<br>
                <span class="headline-highlight">PAGAR CARO EM<br>PERFUMES!</span>
            </h1>

            <!-- Stats Badges -->
            <div class="ponte-badges anim-in anim-delay-3">
                <span class="badge-pill">✅ 100% GRATUITO</span>
                <span class="badge-pill">👥 +100.000 MEMBROS</span>
            </div>

            <!-- WhatsApp CTA -->
            <a href="https://chat.whatsapp.com/FvYdBwxcFBFDBKu1f3MmCH" target="_blank" rel="noopener noreferrer"
                class="ponte-cta anim-in anim-delay-4" id="ponte-cta">
                <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                    <path
                        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
                </svg>
                <span>ENTRE NO GRUPO VIP DO WHATSAPP</span>
                <div class="cta-shine"></div>
            </a>

            <!-- Description -->
            <p class="ponte-desc anim-in anim-delay-5">
                Entre no nosso grupo VIP e receba as melhores<br>
                promoções da internet todos os dias!
            </p>

            <!-- Countdown Section -->
            <div class="countdown-section anim-in anim-delay-6">
                <div class="countdown-ring-wrapper">
                    <svg class="countdown-svg" viewBox="0 0 100 100">
                        <circle class="ring-track" cx="50" cy="50" r="44" />
                        <circle class="ring-progress" cx="50" cy="50" r="44" id="ring-progress" />
                    </svg>
                    <span class="countdown-num" id="countdown-num">5</span>
                </div>
                <p class="countdown-label">
                    Redirecionando em <strong id="countdown-sec">5</strong> segundos...
                </p>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let remaining = 5;
            const numEl = document.getElementById('countdown-num');
            const secEl = document.getElementById('countdown-sec');
            const redirectUrl = 'https://chat.whatsapp.com/FvYdBwxcFBFDBKu1f3MmCH';

            const timer = setInterval(() => {
                remaining--;
                numEl.textContent = remaining;
                secEl.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(timer);
                    window.location.href = redirectUrl;
                }
            }, 1000);

            // Allow manual click to skip countdown
            document.getElementById('ponte-cta').addEventListener('click', () => {
                clearInterval(timer);
            });
        });
    </script>
</body>

</html>
